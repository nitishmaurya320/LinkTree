<style>
  :root {
  --bg-light: #f9f9f9;
  --text-light: #333;
  --card-light: #fff;
  --border-light: #ddd;
  --bg-dark: #121212;
  --text-dark: #f1f1f1;
  --card-dark: #1e1e1e;
  --border-dark: #444;
  --gdg-blue: #4285F4;
  --gdg-red: #EA4335;
  --gdg-green: #34A853;
}

/* Base styles */
body {
  position: relative;
  font-family: Arial, sans-serif;
  background: var(--bg-light);
  color: var(--text-light);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;

  transition: all 0.3s;
  justify-content: center;
  
}

body.dark {
  background: var(--bg-dark);
  color: var(--text-dark);
}
body.dark .container {
  background: rgba(53, 42, 42, 0.6);
}

.container {
  background: rgba(255, 255, 255, 0.3);
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  /* border: 1px solid rgba(255, 255, 255, 0.34); */
  padding: 25px;
  
  width: 100%;
  transition: all 0.3s;
}

.logo {
  width: 100%;
  display: flex;
  height: 90px;
  justify-content: center;
  align-items: center;
  padding-top: 20px;
  z-index: -2;
  overflow: hidden;
  
  position: relative;
}
.logo dotlottie-wc{
  width: 1300px; 
  height: 300px; 
  object-fit:cover;
  overflow: hidden; 
   cursor: pointer;
   position: absolute;
   top:-50px
   
}



.logo dotlottie-wc:hover {
  transform: scale(1.1);
}

h1 { margin: 10px 0; font-size: 24px; }
h4 { margin: 5px 0; font-weight: normal; color: gray; }
p { margin: 15px 0; }

.link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-decoration: none;
  padding: 14px 20px;
  margin: 12px 0;
  font-weight: bold;
  font-size: 16px;
  border-radius: 16px;

  /* Glassmorphism background */
  background: rgba(255, 255, 255, 0.3);
  border: 2px solid transparent;
  background-clip: padding-box;
  position: relative;
  color: var(--text-light);
  overflow: hidden;
  transition: all 0.1s ease;
}

.link:hover {
  border-color: var(--gdg-blue);
  color: black;

  /* background: var(--gdg-blue); */
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

body.dark .link {
  background: rgba(255, 255, 255, 0.15);
  /* border: 2px solid transparent; */
  background-clip: padding-box;
  position: relative;
  color: var(--text-dark);
  overflow: hidden;
  transition: all 0.1s ease;
  /* background: var(--card-dark);
  color: var(--text-dark);
  border: 2px solid var(--border-dark); */
}

.toggle-btn {
  margin-top: 15px;
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  background: var(--gdg-blue);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.toggle-btn:hover {
  background: #3367d6;
  transform: scale(1.05);
}

footer {
  margin-top: 20px;
  font-size: 14px;
  color: gray;
}


.toggle{
  position: absolute;
  right:0px;
  top:0px;
  z-index: 10000;
}
.overlay {
  background-image: url(./logo.png);
  background-size: 100%; 
  width: 100%;    
  background-position: center;  
  background-repeat: no-repeat;
  display: flex;
  justify-content: center;
 
  position: relative;
  justify-content: center;
  align-items: center;

  
 
}

/* 📱 Mobile */
@media (max-width: 600px) {
  .container {
    padding: 15px;
    max-width: 100%;
  }
  .overlay{
    width: 98%;
    background-size: 250%; 
    
  }

  .hero{
    display: none;
  }

  .logo{
    height: 50px;
   position: relative;
  }
  .logo dotlottie-wc {
    width: 300px;
    height: 300px;
    position: absolute;
    top:-90px;
    
  }

  h1 { font-size: 18px; }
  h4 { font-size: 14px; }
  p { font-size: 14px; }

  .link {
    font-size: 14px;
    padding: 10px;
    border-radius: 20px;
  }

  .toggle-btn {
    font-size: 14px;
    padding: 8px 16px;
  }
}

/* 📲 Tablets */
@media (min-width: 601px) and (max-width: 1024px) {
  .container {
    max-width: 90%;
  }

  .logo dotlottie-wc {
    width: 140px;
    height: 140px;
  }

  h1 { font-size: 22px; }
  p { font-size: 15px; }
}

/* 💻 Large screens */
@media (min-width: 1025px) {
  .container {
    max-width: 600px;
  }
}
.circle-red{
  border-radius: 50%;
  width: 200px;
  height: 200px;
  background-color: rgba(236, 66, 53);
  position: fixed;
  top:-50px;
  left:-50px
}
.circle-yellow{
  border-radius: 50%;
  width: 280px;
  height: 280px;
  background-color: rgba(249, 187, 4);
  position: fixed;
  bottom:-60px;
  right:-90px;
}
.triangle {
  width: 0px;
  height: 0px;
  border-left: 80px solid transparent;
  border-right: 80px solid transparent;
  border-bottom: 140px solid rgba(66, 133, 246); /* triangle color */
  position: fixed;
  right:-60px;
  rotate: 50deg;
  top:40%;

}
.circle-green{
  border-radius: 130px;
  width: 400px;
  height: 250px;
  background-color: rgba(16, 157, 88);
  position: fixed;
  bottom:-70px;
  left:-170px;
  rotate: -30deg
}
.square-blue{
  width:200px;
  height:200px;
  border-radius: 50px;
  rotate: 45deg;
  position: fixed;
  right:50px;
  top:-100px;
  background-color: rgba(66, 133, 246)  ;
}
.square-green{
  width:100px;
  height:100px;
  border-radius: 25px;
  rotate: 45deg;
  position: fixed;
  right:-50px;
  top:50px;
  background-color: rgba(16, 157, 88)  ;
}

/* 🔥 Common slide-in animation */
@keyframes slideIn {
  0% {
    transform: translate(var(--start-x), var(--start-y));
    opacity: 0;
  }
  100% {
    transform: translate(0,0);
    opacity: 1;
  }
}

/* Apply animation */
.circle-red,
.circle-green,
.circle-yellow,
.triangle,
.square-blue,
.square-green,
.wavy-circle {
  animation: slideIn 1s ease-out forwards;
  opacity: 0;
}

/* 👉 Different start directions */
.circle-red {
  --start-x: -300px;   /* from left */
  --start-y: -300px;   /* from top */
  animation-delay: 0.2s;
}
.wavy-circle{
   --start-x: -300px;   /* from left */
  --start-y: -300px;   /* from top */
  animation-delay: 0.5s;
}

.circle-yellow {
  --start-x: 300px;   /* from right */
  --start-y: 300px;   /* from bottom */
  animation-delay: 0.4s;
}

.triangle {
  --start-x: 300px;   /* from right */
  --start-y: 0px;     /* slide horizontally */
  animation-delay: 0.6s;
}

.circle-green {
  --start-x: -400px;  /* from left */
  --start-y: 300px;   /* from bottom */
  animation-delay: 0.8s;
}

.square-blue {
  --start-x: 0px;
  --start-y: -400px;  /* from top */
  animation-delay: 1s;
}

.square-green {
  --start-x: 300px;   /* from right */
  --start-y: -200px;  /* from top-right */
  animation-delay: 1.2s;
}
/* 📱 Mobile (max-width: 600px) */
@media (max-width: 600px) {
  .circle-red {
    width: 120px;
    height: 120px;
    top: -30px;
    left: -30px;
  }
  .circle-yellow {
    width: 160px;

    right: -80px;

  .triangle {
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 90px solid rgba(66, 133, 246);
    right: -30px;
    
  }
  .circle-green {
    width: 250px;
    height: 160px;
    bottom: -50px;
    left: -160px;
  }
  .square-blue {
    width: 120px;
    height: 120px;
    right: 20px;
    top: -60px;
  }
  .square-green {
    width: 70px;
    height: 70px;
    right: -30px;
    top: 40px;
  }
  .wavy-circle {
    width: 150px;
    height: 150px;
    left: -80px;
  }
}
.link-icon {
  width: 20px;       /* icon size */
  height: 20px;

.checkbox {
  opacity: 0;
  position: absolute;
}

.checkbox-label {
 
  width: 41px;
  height: 17px;
  border-radius: 50px;
  position: relative;
  padding: 5px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 2px solid rgb(41, 41, 41);
}

.fa-moon {color: white;
}

.fa-sun {
  color: #f39c12;
  z-index:3;
}

.checkbox-label .ball {
  background-color: black;
  width: 25px;
  height: 25px;
  position: absolute;
  left: 2px;
  top: 0.8px;
  border-radius: 50%;
  transition: transform 0.2s linear;
}

.checkbox:checked + .checkbox-label .ball {
  transform: translateX(23px);
}
.links{
  z-index: 100;
}
.hero{

/* ✨ Link entrance animation */
@keyframes linkFadeUp {
  0% {
    transform: translateY(30px);
    opacity: 0;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

.link {
  opacity: 0; /* start hidden */
  animation: linkFadeUp 0.8s ease-out forwards;
}

/* 👉 Stagger the animation for each link */
.links .link:nth-child(1)  { animation-delay: 0.1s; }
.links .link:nth-child(2)  { animation-delay: 0.2s; }
.links .link:nth-child(3)  { animation-delay: 0.3s; }
.links .link:nth-child(4)  { animation-delay: 0.4s; }
.links .link:nth-child(5)  { animation-delay: 0.5s; }

.links .link:nth-child(7)  { animation-delay: 0.7s; }
.links .link:nth-child(8)  { animation-delay: 0.8s; }
.links .link:nth-child(9)  { animation-delay: 0.9s; }
.links .link:nth-child(10) { animation-delay: 1s; }
.links .link:nth-child(11) { animation-delay: 1.1s; }
.links .link:nth-child(12) { animation-delay: 1.2s; }
.links .link:nth-child(13) { animation-delay: 1.3s; }
